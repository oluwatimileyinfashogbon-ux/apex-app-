<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexFlow - Premium Invoicing Suite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'float': 'float 4s ease-in-out infinite',
              'glow': 'glow 3s ease-in-out infinite alternate',
              'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translate3d(0, 0, 0)' },
                '50%': { transform: 'translate3d(0, -8px, 0)' },
              },
              glow: {
                '0%': { opacity: '0.2', transform: 'scale(0.95)' },
                '100%': { opacity: '0.5', transform: 'scale(1.08)' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translate3d(0, 16px, 0)' },
                '100%': { opacity: '1', transform: 'translate3d(0, 0, 0)' },
              }
            }
          }
        }
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        .glass-card {
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            will-change: transform, opacity;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(245, 158, 11, 0.45);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.15);
        }

        /* Custom Mobile Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen antialiased selection:bg-amber-500 selection:text-black relative overflow-x-hidden">

    <div class="fixed top-[-50px] left-1/2 -translate-x-1/2 w-[350px] md:w-[600px] h-[250px] bg-amber-500/15 blur-[100px] rounded-full pointer-events-none animate-glow"></div>
    <div class="fixed bottom-0 right-0 w-[300px] h-[300px] bg-yellow-600/10 blur-[120px] rounded-full pointer-events-none"></div>

    <div id="authContainer" class="min-h-screen flex items-center justify-center p-4 relative z-10">
        <div class="glass-card p-7 md:p-8 rounded-3xl w-full max-w-md shadow-2xl animate-slide-up relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-28 h-28 bg-amber-500/20 rounded-full blur-2xl"></div>

            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 text-black font-black text-xl mb-3 shadow-lg shadow-amber-500/25 animate-float">
                    ⚡
                </div>
                <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-500">ApexFlow</h1>
                <p class="text-xs text-amber-400/80 mt-1 font-semibold tracking-wide">Premium Invoicing & Revenue Suite</p>
            </div>
            
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-amber-400/90 mb-1.5">Email Address</label>
                    <input type="email" id="authEmail" required placeholder="you@example.com" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200 placeholder:text-zinc-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-amber-400/90 mb-1.5">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200 placeholder:text-zinc-600">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" onclick="authAction='login'" class="w-1/2 bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-500 hover:brightness-110 active:scale-95 text-zinc-950 font-bold text-sm py-3 rounded-xl shadow-lg shadow-amber-500/20 transition-all duration-200">Log In</button>
                    <button type="submit" onclick="authAction='signup'" class="w-1/2 bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-amber-300 font-semibold text-sm py-3 rounded-xl border border-amber-500/25 transition-all duration-200">Sign Up</button>
                </div>
            </form>
            <p id="authError" class="text-xs text-rose-400 mt-4 text-center hidden bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-xl font-medium"></p>
        </div>
    </div>

    <div id="dashboardContainer" class="hidden min-h-screen p-4 md:p-8 max-w-6xl mx-auto space-y-6 relative z-10 animate-slide-up">
        
        <header class="flex justify-between items-center glass-card p-4 md:px-6 rounded-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-black font-black text-lg shadow-md shadow-amber-500/20 animate-float">
                    ⚡
                </div>
                <div>
                    <h1 class="text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-500 leading-tight">ApexFlow</h1>
                    <p id="userEmailDisplay" class="text-[11px] text-zinc-400 font-mono"></p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-amber-400 border border-amber-500/30 px-3.5 py-2 rounded-xl transition-all duration-200 font-semibold hover:border-amber-500/60 active:scale-95 flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Log Out
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass-card p-5 rounded-2xl relative overflow-hidden group">
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-amber-500/10 rounded-full blur-xl group-hover:bg-amber-500/25 transition-all duration-500"></div>
                <span class="text-[11px] text-amber-400/80 uppercase tracking-wider font-bold">Total Revenue</span>
                <p id="statTotalRevenue" class="text-2xl font-black text-white mt-1 font-mono">₦0.00</p>
            </div>
            <div class="glass-card p-5 rounded-2xl relative overflow-hidden group">
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-yellow-500/10 rounded-full blur-xl group-hover:bg-yellow-500/25 transition-all duration-500"></div>
                <span class="text-[11px] text-amber-400/80 uppercase tracking-wider font-bold">Pending Amount</span>
                <p id="statPendingRevenue" class="text-2xl font-black text-amber-400 mt-1 font-mono">₦0.00</p>
            </div>
            <div class="glass-card p-5 rounded-2xl relative overflow-hidden group">
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-amber-400/10 rounded-full blur-xl group-hover:bg-amber-400/25 transition-all duration-500"></div>
                <span class="text-[11px] text-amber-400/80 uppercase tracking-wider font-bold">Total Invoices</span>
                <p id="statTotalCount" class="text-2xl font-black text-yellow-500 mt-1 font-mono">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="glass-card p-6 rounded-2xl space-y-4 self-start">
                <div class="flex items-center justify-between border-b border-zinc-800/80 pb-3">
                    <h2 class="text-xs font-bold text-amber-400 tracking-wider uppercase flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                        Create Invoice
                    </h2>
                </div>

                <form id="invoiceForm" class="space-y-3.5">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Client Name</label>
                        <input type="text" id="clientName" required placeholder="Acme Corp" 
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition-all duration-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Client Email</label>
                        <input type="email" id="clientEmail" required placeholder="client@acme.com" 
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition-all duration-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Amount (₦ NGN)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-amber-400 font-bold text-sm pointer-events-none">₦</span>
                            <input type="number" step="0.01" id="amount" required placeholder="60000" 
                                class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-8 pr-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition-all duration-200">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Due Date</label>
                        <input type="date" id="dueDate" required 
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition-all duration-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Your Payment Link <span class="text-zinc-500 font-normal">(Optional)</span></label>
                        <input type="url" id="payLink" placeholder="https://app.raenest.com/pay/..." 
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition-all duration-200 placeholder:text-zinc-600">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-500 hover:brightness-110 active:scale-95 text-black font-bold text-sm py-3 rounded-xl transition-all duration-200 shadow-lg shadow-amber-500/20 mt-2 flex items-center justify-center gap-2">
                        <span>Generate Invoice</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 glass-card rounded-2xl p-6 overflow-hidden flex flex-col">
                <div class="flex items-center justify-between border-b border-zinc-800/80 pb-3 mb-4">
                    <h2 class="text-xs font-bold text-amber-400 tracking-wider uppercase flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                        Invoices Feed
                    </h2>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[500px]">
                        <thead>
                            <tr class="text-[11px] text-amber-400/70 border-b border-zinc-800/80 uppercase tracking-wider">
                                <th class="pb-3 px-3 font-semibold">Invoice ID</th>
                                <th class="pb-3 px-3 font-semibold">Client Details</th>
                                <th class="pb-3 px-3 font-semibold">Amount</th>
                                <th class="pb-3 px-3 font-semibold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceTableBody" class="divide-y divide-zinc-800/60 text-sm">
                            <tr><td colspan="4" class="py-12 text-center text-zinc-500">Loading invoices...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. SUPABASE CONFIGURATION
        const SUPABASE_URL = 'https://neyoalmoarwvurlpajwr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_wy-u-4gq2FDwAq6Ydg6Zag_Oku_5RKV';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let storedInvoices = [];
        let authAction = 'login';

        // 2. AUTHENTICATION HANDLERS
        const authForm = document.getElementById('authForm');
        const authError = document.getElementById('authError');

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            try {
                let response;
                if (authAction === 'signup') {
                    response = await supabaseClient.auth.signUp({ email, password });
                } else {
                    response = await supabaseClient.auth.signInWithPassword({ email, password });
                }

                if (response.error) throw response.error;
                
                if (authAction === 'signup' && !response.data.session) {
                    alert('Signup successful! Check your email inbox for confirmation.');
                }
            } catch (err) {
                authError.textContent = err.message;
                authError.classList.remove('hidden');
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
        }

        // Listen for Auth changes
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('dashboardContainer').classList.remove('hidden');
                document.getElementById('userEmailDisplay').textContent = currentUser.email;
                loadInvoices();
            } else {
                currentUser = null;
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('dashboardContainer').classList.add('hidden');
            }
        });

        // 3. INVOICE CREATION
        const invoiceForm = document.getElementById('invoiceForm');
        invoiceForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const name = document.getElementById('clientName').value;
            const email = document.getElementById('clientEmail').value;
            const amt = parseFloat(document.getElementById('amount').value);
            const due = document.getElementById('dueDate').value;
            const customPayLink = document.getElementById('payLink').value;

            try {
                // Insert client
                let { data: client, error: clientErr } = await supabaseClient
                    .from('clients')
                    .insert([{ user_id: currentUser.id, client_name: name, client_email: email }])
                    .select()
                    .single();

                if (clientErr) throw clientErr;

                // Insert invoice
                const invNum = 'INV-' + Math.floor(1000 + Math.random() * 9000);
                const { error: invErr } = await supabaseClient
                    .from('invoices')
                    .insert([{
                        user_id: currentUser.id,
                        client_id: client.id,
                        amount: amt,
                        due_date: due,
                        invoice_number: invNum,
                        pay_link: customPayLink || null,
                        currency: '₦',
                        status: 'sent'
                    }]);

                if (invErr) throw invErr;

                invoiceForm.reset();
                loadInvoices();
            } catch (err) {
                alert('Error creating invoice: ' + err.message);
            }
        });

        // 4. LOAD & RENDER INVOICES
        async function loadInvoices() {
            const tableBody = document.getElementById('invoiceTableBody');
            try {
                const { data: invoices, error } = await supabaseClient
                    .from('invoices')
                    .select('*, clients(client_name, client_email)')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                storedInvoices = invoices || [];

                if (storedInvoices.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="py-12 text-center text-zinc-500">No invoices generated yet. Create your first one!</td></tr>`;
                    updateStats(0, 0, 0);
                    return;
                }

                let total = 0, pending = 0;
                tableBody.innerHTML = storedInvoices.map((inv, idx) => {
                    const amt = parseFloat(inv.amount) || 0;
                    const isPaid = inv.status === 'paid';

                    total += amt;
                    if (!isPaid) pending += amt;

                    const cName = inv.clients ? inv.clients.client_name : 'Client';
                    const cEmail = inv.clients ? inv.clients.client_email : '';

                    const statusBadge = isPaid 
                        ? `<span class="inline-flex items-center gap-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse-slow"></span>PAID</span>`
                        : `<span class="inline-flex items-center gap-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse-slow"></span>PENDING</span>`;

                    const linkToPass = inv.pay_link ? inv.pay_link.replace(/'/g, "\\'") : '';

                    return `
                        <tr class="hover:bg-amber-500/5 transition-all duration-200 animate-slide-up">
                            <td class="py-3.5 px-3">
                                <div class="font-mono text-xs font-bold text-amber-400 tracking-wider">${inv.invoice_number}</div>
                                <div class="mt-1">${statusBadge}</div>
                            </td>
                            <td class="py-3.5 px-3">
                                <div class="font-semibold text-white leading-tight">${cName}</div>
                                <div class="text-xs text-zinc-400 font-mono mt-0.5">${cEmail}</div>
                            </td>
                            <td class="py-3.5 px-3 font-semibold text-white font-mono">₦${amt.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                            <td class="py-3.5 px-3 text-right">
                                <div class="inline-flex items-center gap-1.5 justify-end">
                                    ${!isPaid ? `
                                        <button onclick="markAsPaid('${inv.id}')" title="Mark Paid" class="bg-emerald-600/90 hover:bg-emerald-500 active:scale-95 text-white text-[11px] px-2.5 py-1.5 rounded-lg font-medium transition-all shadow-sm shadow-emerald-600/20 flex items-center gap-1">
                                            ✓
                                        </button>
                                    ` : ''}
                                    <button onclick="triggerPayment('${linkToPass}')" title="Pay Link" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:brightness-110 active:scale-95 text-black text-[11px] px-2.5 py-1.5 rounded-lg font-bold transition-all shadow-sm shadow-amber-500/20 flex items-center gap-1">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                                        Pay
                                    </button>
                                    <button onclick="downloadPDF(${idx})" title="Download PDF" class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-amber-300 border border-amber-500/20 text-[11px] px-2.5 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                        PDF
                                    </button>
                                    <button onclick="deleteInvoice('${inv.id}')" title="Delete" class="text-zinc-500 hover:text-rose-400 active:scale-95 p-1.5 rounded-lg hover:bg-rose-500/10 transition-all">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

                updateStats(total, pending, storedInvoices.length);
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="4" class="py-12 text-center text-rose-500">Error: ${err.message}</td></tr>`;
            }
        }

        function updateStats(total, pending, count) {
            document.getElementById('statTotalRevenue').textContent = '₦' + total.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('statPendingRevenue').textContent = '₦' + pending.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('statTotalCount').textContent = count;
        }

        // 5. ACTION HANDLERS
        async function markAsPaid(invoiceId) {
            try {
                const { error } = await supabaseClient
                    .from('invoices')
                    .update({ status: 'paid' })
                    .eq('id', invoiceId);
                if (error) throw error;
                loadInvoices();
            } catch (err) {
                alert('Error updating status: ' + err.message);
            }
        }

        async function deleteInvoice(invoiceId) {
            if (!confirm("Are you sure you want to delete this invoice?")) return;
            try {
                const { error } = await supabaseClient
                    .from('invoices')
                    .delete()
                    .eq('id', invoiceId);
                if (error) throw error;
                loadInvoices();
            } catch (err) {
                alert('Error deleting invoice: ' + err.message);
            }
        }

        function triggerPayment(payLink) {
            if (payLink && payLink.trim() !== '') {
                window.open(payLink, '_blank');
            } else {
                alert('No payment link was attached to this invoice.');
            }
        }

        function downloadPDF(index) {
            const inv = storedInvoices[index];
            if (!inv) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const cName = inv.clients ? inv.clients.client_name : 'Client';

            doc.setFontSize(22);
            doc.text("INVOICE", 20, 25);
            doc.setFontSize(11);
            doc.text(`Invoice Number: ${inv.invoice_number}`, 20, 40);
            doc.text(`Client: ${cName}`, 20, 50);
            doc.text(`Due Date: ${inv.due_date}`, 20, 60);
            doc.text(`Amount: NGN ${parseFloat(inv.amount).toLocaleString('en-US', {minimumFractionDigits: 2})}`, 20, 70);
            doc.text(`Status: ${(inv.status || 'sent').toUpperCase()}`, 20, 80);

            if (inv.pay_link) {
                doc.text(`Payment Link: ${inv.pay_link}`, 20, 92);
            }

            doc.save(`${inv.invoice_number}.pdf`);
        }
    </script>
</body>
</html>
